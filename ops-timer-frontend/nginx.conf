# Missing paths reach the backend before SPA fallback. This supports any MCP
# path saved by the administrator without regenerating proxy configuration.
map "$request_method:$http_accept" $spa_fallback {
    default /__no_spa_fallback__;
    ~^GET:.*text/html /index.html;
}
log_format integration '$request_id $request_method $uri status=$status bytes=$body_bytes_sent '
                       'type=$sent_http_content_type upstream=$upstream_status '
                       'time=$request_time upstream_time=$upstream_response_time';
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log integration;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;
    proxy_buffering off;
    proxy_cache off;
    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ @backend;
    }
    location @backend {
        proxy_pass http://backend:8080;
        proxy_intercept_errors on;
        error_page 404 = @spa;
    }
    location @spa {
        try_files $spa_fallback =404;
    }
    location /api/ { proxy_pass http://backend:8080; }
    location /health { proxy_pass http://backend:8080; }
    location /oauth/ { proxy_pass http://backend:8080; }
    location /.well-known/ { proxy_pass http://backend:8080; }
    location /mcp { proxy_pass http://backend:8080; }
}
